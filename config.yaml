# Casino radar settings. Edit freely; the next run picks up changes.

run_budget_seconds: 300  # public repo, every 10 min. Private repo: 30 (and schedule every 30 min)

# ================================================================ telegram
# Urgent alerts: one message each, with sound. Everything else: one silent roundup
# every few hours, grouped by type. Every alert carries hashtags (#hack #onchain
# #site #licence #news #forum #freeze ... plus the casino, e.g. #stake) so you can tap one
# to see them all.
telegram:
  # Every run (10 min): urgent stories one by one with sound, then one short update with the rest.
  # Every report_every_hours: a report of every story in that window, each story once, urgent on top.
  report_every_hours: 5
  updates_silent: true        # the 10-minute update arrives without sound; urgent always rings
  update_items_per_type: 8
  report_items_per_type: 30
  max_urgent_per_run: 10      # more than this in one run: the rest go in one combined urgent message
  # Optional: a Telegram group with Topics. Put each topic's id here (see README).
  topics: {}
  #  urgent: 2
  #  updates: 3
  #  reports: 4

