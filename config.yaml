chains:
  outflow_min_usd: 250000   # watched wallet sends at least this in one transfer
  big_payout_usd: 2000000   # casino wallet paying this much to a normal address = possible big win (HIGH)
  deposit_drop_share: 0.25    # hot wallet deposits yesterday below 25% of its 7-day average = DEPOSITS COLLAPSED (urgent)
  deposit_min_avg_usd: 50000  # only for wallets averaging at least this much a day
  fresh_max_txs: 3          # receiver with this many transactions or fewer counts as fresh
  max_blocks_per_run: 20000
